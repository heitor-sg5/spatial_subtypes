[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialsubtypes"
version = "0.1.0"
description = "Spatially informed subtyping of one cell type in spatial transcriptomics data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "anndata>=0.9",
    "igraph>=0.10",
    "leidenalg>=0.9",
]

[project.optional-dependencies]
benchmarks = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
